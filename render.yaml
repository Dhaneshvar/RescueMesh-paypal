services:
  - type: web
    name: rescuemesh-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CURRENCY
        value: USD
      - key: PAYPAL_MCP_URL
        value: https://mcp.sandbox.paypal.com/http
      - key: PAYPAL_MCP_ACCESS_TOKEN
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://rescuemesh-web.onrender.com

  - type: web
    name: rescuemesh-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://rescuemesh-api.onrender.com
      - key: VITE_PAYPAL_CLIENT_ID
        sync: false
      - key: VITE_PAYPAL_CURRENCY
        value: USD
